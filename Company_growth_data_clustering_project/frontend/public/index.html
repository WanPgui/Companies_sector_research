<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Company Growth Analytics System" />
    <title>Company Growth Analytics</title>

    <!-- Google Fonts: Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <style>
      /* Reset */
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #333;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 30px 10px;
      }

      /* Container for the app */
      #root {
        width: 100%;
        max-width: 900px;
      }

      /* App card style */
      .app-card {
        background: #fff;
        border-radius: 15px;
        padding: 30px 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        margin-bottom: 30px;
      }

      .app-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      }

      h1, h2 {
        text-align: center;
        color: #1e3c72;
      }

      p {
        text-align: center;
        color: #555;
        margin-bottom: 25px;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-bottom: 25px;
      }

      nav a {
        text-decoration: none;
        color: #fff;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
        background-color: rgba(255,255,255,0.1);
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      nav a:hover {
        background-color: rgba(255,255,255,0.2);
        transform: translateY(-2px);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-height: 450px;
        overflow-y: auto;
        padding-right: 5px;
      }

      label {
        font-weight: 500;
        margin-bottom: 5px;
        display: block;
      }

      input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus, select:focus {
        outline: none;
        border-color: #1e3c72;
        box-shadow: 0 0 0 3px rgba(30, 60, 114, 0.2);
      }

      button {
        background-color: #1e3c72;
        color: #fff;
        font-weight: 600;
        border: none;
        padding: 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      button:hover {
        background-color: #2a5298;
        transform: translateY(-2px);
      }

      button:disabled {
        background-color: #aaa;
        cursor: not-allowed;
        transform: none;
      }

      /* Result card */
      .result-card {
        margin-top: 25px;
        padding: 20px;
        background: #f1f5f9;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        text-align: center;
      }

      .result-card h2 {
        margin-bottom: 10px;
        color: #1e3c72;
      }

      .result-card p {
        font-size: 16px;
        color: #333;
      }

      /* History table */
      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        padding: 12px 10px;
        border: 1px solid #ccc;
        text-align: center;
      }

      th {
        background-color: #1e3c72;
        color: #fff;
      }

      tr:nth-child(even) {
        background-color: #f1f5f9;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
